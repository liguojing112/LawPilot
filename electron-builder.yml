appId: com.lawpilot.app
productName: LawPilot
copyright: Copyright © 2024 LawPilot

directories:
  output: dist
  buildResources: resources

files:
  - out/**/*
  - resources/icons/**

asar: true
asarUnpack:
  - "node_modules/better-sqlite3/**"
  - "node_modules/electron-log/**"

compression: maximum

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icons/icon.ico
  sign: null
  signAndEditExecutable: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: LawPilotSetup${version}.exe
  installerIcon: resources/icons/icon.ico
  uninstallerIcon: resources/icons/icon.ico
  installerHeaderIcon: resources/icons/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: LawPilot
  language: 2052

portable:
  artifactName: LawPilot-portable-${version}.${ext}

extraResources:
  # 内嵌 Python 运行时（解释器 + CPU 版依赖 + 内置模型 + 应用源码）
  # 安装后位于 resources/python/，python-bridge 生产分支直接找 python.exe
  - from: python-dist/
    to: python/
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
      - "!**/*.pyd.old"
