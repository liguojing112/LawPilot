appId: com.lawpilot.app
productName: LawPilot
copyright: Copyright © 2024 LawPilot

directories:
  output: dist
  buildResources: resources

files:
  - out/**/*
  - resources/icons/**

asar: true
asarUnpack:
  - "node_modules/better-sqlite3/**"
  - "node_modules/electron-log/**"

compression: maximum

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icons/icon.ico
  sign: null
  signAndEditExecutable: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: resources/icons/icon.ico
  uninstallerIcon: resources/icons/icon.ico
  installerHeaderIcon: resources/icons/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: LawPilot
  language: 2052

portable:
  artifactName: LawPilot-portable-${version}.${ext}

extraResources:
  - from: python/
    to: python/
    filter:
      - "**/*"
      - "!__pycache__/**"
      - "!*.pyc"
